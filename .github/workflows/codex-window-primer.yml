name: Codex window primer

on:
  schedule:
    # codex-window-primer: cron-managed
    - cron: "0 0 1 1 *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-window-primer
  cancel-in-progress: false

env:
  CODEX_MODEL: gpt-5.6-luna
  CODEX_CLI_VERSION: 0.150.1
  PLAN_FILE: schedule.json

jobs:
  prime:
    runs-on: ubuntu-24.04
    # Leave room for the bounded Codex request and OAuth-state persistence.
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether this run is due
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime
          from schedule_logic import due_window, validate_plan

          with open(os.environ["PLAN_FILE"], "r", encoding="utf-8") as handle:
              plan = json.load(handle)

          if not plan.get("enabled", False):
              print("Plan is disabled; scheduled run skipped.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("should_run=false\n")
              raise SystemExit(0)

          try:
              timing = validate_plan(plan)
          except (KeyError, TypeError, ValueError):
              raise SystemExit("Invalid schedule configuration")

          now = datetime.now(timing.zone)
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              due = True
              primer = timing.primer
              print("Manual run requested; bypassing only the calendar gate.")
          else:
              due, primer = due_window(plan, now)

          print(f"Configured timezone: {plan['timezone']}; current local time: {now.isoformat()}")
          print(f"Computed prime time: {primer.isoformat()}; mode: {plan['mode']}; due: {str(due).lower()}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_run={str(due).lower()}\n")
          PY

      - name: Install age
        if: steps.gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age

      - name: Install pinned official Codex CLI
        if: steps.gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund "@openai/codex@${CODEX_CLI_VERSION}"
          codex --version >/dev/null

      - name: Decrypt OAuth state and derive age recipient
        if: steps.gate.outputs.should_run == 'true'
        env:
          AGE_PRIVATE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077

          key_file="$RUNNER_TEMP/age-key.txt"
          recipient_file="$RUNNER_TEMP/age-recipient.txt"
          codex_home="$RUNNER_TEMP/codex-home"
          base_commit_file="$RUNNER_TEMP/base-commit.txt"
          base_auth_blob_file="$RUNNER_TEMP/base-auth-blob.txt"
          auth_before_file="$RUNNER_TEMP/auth-before.sha256"

          remove_private_key() {
            rm -f "$key_file"
          }
          trap remove_private_key EXIT

          if [[ -z "${AGE_PRIVATE_KEY:-}" ]]; then
            echo "::error::The AGE_PRIVATE_KEY repository secret is not configured."
            exit 1
          fi
          if [[ ! -s auth.json.enc ]]; then
            echo "::error::auth.json.enc is missing or empty. Complete the local bootstrap first."
            exit 1
          fi

          mkdir -p "$codex_home"
          chmod 700 "$codex_home"
          printf '%s\n' "$AGE_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"

          cat > "$codex_home/config.toml" <<'EOF'
          cli_auth_credentials_store = "file"
          model_reasoning_effort = "low"
          allow_login_shell = false

          [shell_environment_policy]
          inherit = "core"
          ignore_default_excludes = false
          include_only = ["CODEX_HOME", "HOME", "PATH", "TMPDIR", "LANG", "LC_*", "TERM"]
          EOF

          if ! age --decrypt \
            --identity "$key_file" \
            --output "$codex_home/auth.json" \
            auth.json.enc >/dev/null 2>&1; then
            echo "::error::Encrypted Codex credential bundle could not be decrypted."
            exit 1
          fi
          chmod 600 "$codex_home/auth.json"

          if ! recipient="$(age-keygen -y < "$key_file")"; then
            echo "::error::The age recipient could not be derived."
            exit 1
          fi
          printf '%s\n' "$recipient" > "$recipient_file"
          chmod 600 "$recipient_file"
          git rev-parse HEAD > "$base_commit_file"
          git rev-parse HEAD:auth.json.enc > "$base_auth_blob_file"
          sha256sum "$codex_home/auth.json" | cut -d' ' -f1 > "$auth_before_file"

          remove_private_key
          trap - EXIT
          unset AGE_PRIVATE_KEY
          test ! -e "$key_file"
          echo "OAuth state decrypted; private age key removed before Codex execution."

      - name: Run one quiet Codex request
        id: codex
        if: steps.gate.outputs.should_run == 'true'
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          set -euo pipefail
          codex_output="$RUNNER_TEMP/codex-output.txt"
          codex_error="$RUNNER_TEMP/codex-error.txt"
          set +e
          # A hung request must not prevent the following state-persistence steps.
          timeout --signal=TERM --kill-after=15s 3m \
          env -i \
            HOME="${HOME:-/home/runner}" \
            PATH="$PATH" \
            CODEX_HOME="$CODEX_HOME" \
            TMPDIR="${TMPDIR:-/tmp}" \
            LANG="${LANG:-C.UTF-8}" \
            TERM="${TERM:-dumb}" \
            codex exec \
              --model "$CODEX_MODEL" \
              --config model_reasoning_effort=low \
              --sandbox read-only \
              --skip-git-repo-check \
              --ephemeral \
              "Reply with exactly: OK" \
              >"$codex_output" 2>"$codex_error"
          codex_status="$?"
          set -e
          echo "codex_status=$codex_status" >> "$GITHUB_OUTPUT"
          if [[ -s "$CODEX_HOME/auth.json" ]]; then
            echo "auth_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "auth_present=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$codex_status" -ne 0 ]]; then
            echo "::error::Codex invocation failed; response and diagnostic output were suppressed. Continuing to inspect credential state."
          else
            echo "Codex invocation completed; response output was suppressed."
          fi

      - name: Re-encrypt refreshed state without GitHub token
        id: state
        if: ${{ always() && !cancelled() && steps.gate.outputs.should_run == 'true' }}
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          set -euo pipefail
          echo "changed=false" >> "$GITHUB_OUTPUT"
          if [[ ! -s "$CODEX_HOME/auth.json" ]]; then
            echo "::error::Codex credential file was not available for state persistence."
            exit 0
          fi
          if [[ ! -s "$RUNNER_TEMP/auth-before.sha256" ]]; then
            echo "::error::Credential baseline was not available; refreshed state cannot be safely persisted."
            exit 1
          fi
          before_sha="$(cat "$RUNNER_TEMP/auth-before.sha256")"
          after_sha="$(sha256sum "$CODEX_HOME/auth.json" | cut -d' ' -f1)"
          if [[ "$before_sha" == "$after_sha" ]]; then
            echo "Encrypted credential bundle was unchanged."
            exit 0
          fi

          recipient="$(cat "$RUNNER_TEMP/age-recipient.txt")"
          if ! age --encrypt \
            --recipient "$recipient" \
            --output "$RUNNER_TEMP/auth.json.enc.next" \
            "$CODEX_HOME/auth.json" >/dev/null 2>&1; then
            echo "::error::Refreshed OAuth state could not be re-encrypted."
            exit 1
          fi
          test -s "$RUNNER_TEMP/auth.json.enc.next"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Refreshed OAuth state was encrypted with the saved public recipient."

      - name: Rebase and push refreshed ciphertext
        id: persist
        if: ${{ always() && !cancelled() && steps.gate.outputs.should_run == 'true' && steps.state.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "conflict=false" >> "$GITHUB_OUTPUT"
          branch="$GITHUB_REF_NAME"
          recovery_branch="codex-auth-recovery-${GITHUB_RUN_ID}"

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::GitHub push authorization was unavailable."
            exit 1
          fi
          if git config --show-origin --get-regexp 'http\..*extraheader' >/dev/null 2>&1; then
            echo "::error::A persistent GitHub authorization header was found in git config."
            exit 1
          fi

          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header"
          export GIT_TERMINAL_PROMPT=0

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          base_commit="$(cat "$RUNNER_TEMP/base-commit.txt")"
          base_auth_blob="$(cat "$RUNNER_TEMP/base-auth-blob.txt")"
          if [[ "$(git rev-parse HEAD)" != "$base_commit" ]]; then
            echo "::error::The checked-out commit changed unexpectedly; main was not updated."
            exit 1
          fi
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "::error::Unexpected workspace changes were found; main was not updated."
            exit 1
          fi

          if ! git fetch --no-tags origin "$branch" >/dev/null 2>&1; then
            echo "::error::The latest remote branch could not be fetched; main was not updated."
            exit 1
          fi
          remote_head="$(git rev-parse "origin/$branch")"
          if ! remote_auth_blob="$(git rev-parse "$remote_head:auth.json.enc" 2>/dev/null)"; then
            echo "::error::The remote encrypted credential bundle could not be inspected; main was not updated."
            exit 1
          fi
          preserve_conflict() {
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            target_blob="$(git hash-object "$RUNNER_TEMP/auth.json.enc.next")"
            head_blob="$(git rev-parse "HEAD:auth.json.enc" 2>/dev/null || true)"
            if [[ "$head_blob" != "$target_blob" ]]; then
              if ! cp "$RUNNER_TEMP/auth.json.enc.next" auth.json.enc || ! git add auth.json.enc; then
                echo "::error::Remote state changed; main was not updated, and encrypted recovery preservation failed."
                exit 1
              fi
              if git diff --cached --quiet -- auth.json.enc; then
                echo "::error::Remote state changed; recovery ciphertext was not present in the current HEAD and could not be committed."
                exit 1
              fi
              if ! git commit -m "chore: preserve encrypted Codex auth recovery state" >/dev/null 2>&1; then
                echo "::error::Remote state changed; main was not updated, and encrypted recovery preservation failed."
                exit 1
              fi
            fi
            if git push origin "HEAD:refs/heads/$recovery_branch" >/dev/null 2>&1; then
              echo "::error::Remote state changed; main was not updated. Encrypted recovery state was saved to a temporary private branch."
            else
              echo "::error::Remote state changed; main was not updated, and encrypted recovery preservation failed."
            fi
            exit 1
          }

          if [[ "$remote_auth_blob" != "$base_auth_blob" ]]; then
            preserve_conflict
          fi

          cp "$RUNNER_TEMP/auth.json.enc.next" auth.json.enc
          git add auth.json.enc
          if ! git commit -m "chore: refresh encrypted Codex auth bundle" >/dev/null 2>&1; then
            echo "::error::Refreshed OAuth state could not be committed; main was not updated."
            exit 1
          fi

          if ! git rebase "origin/$branch" >/dev/null 2>&1; then
            git rebase --abort >/dev/null 2>&1 || true
            preserve_conflict
          fi
          if ! git push origin "HEAD:$branch" >/dev/null 2>&1; then
            preserve_conflict
          fi
          echo "Codex invocation succeeded; refreshed credentials were saved as ciphertext after a safe rebase."

      - name: Finalize Codex result
        if: ${{ always() && !cancelled() && steps.gate.outputs.should_run == 'true' }}
        env:
          CODEX_STATUS: ${{ steps.codex.outputs.codex_status }}
          AUTH_PRESENT: ${{ steps.codex.outputs.auth_present }}
          STATE_CHANGED: ${{ steps.state.outputs.changed }}
          STATE_OUTCOME: ${{ steps.state.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
        run: |
          set -euo pipefail
          if [[ "${AUTH_PRESENT:-false}" != "true" ]]; then
            echo "::error::Codex credential state was not available after the request; workflow failed."
            exit 1
          fi
          if [[ "${STATE_OUTCOME:-failure}" != "success" ]]; then
            echo "::error::Credential state inspection or re-encryption failed; workflow failed."
            exit 1
          fi
          if [[ "${STATE_CHANGED:-false}" == "true" && "${PERSIST_OUTCOME:-failure}" != "success" ]]; then
            echo "::error::Refreshed credential state was not safely persisted; workflow failed."
            exit 1
          fi
          if [[ "${CODEX_STATUS:-1}" != "0" ]]; then
            echo "::error::Codex request failed after credential-state handling; workflow failed."
            exit 1
          fi
          echo "Codex invocation succeeded; credential state handling completed."

      - name: Remove runner-local credential state
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/age-key.txt" "$RUNNER_TEMP/age-recipient.txt" "$RUNNER_TEMP/base-commit.txt" "$RUNNER_TEMP/base-auth-blob.txt" "$RUNNER_TEMP/auth-before.sha256" "$RUNNER_TEMP/auth.json.enc.next" "$RUNNER_TEMP/codex-output.txt" "$RUNNER_TEMP/codex-error.txt"
          rm -rf "$RUNNER_TEMP/codex-home"
