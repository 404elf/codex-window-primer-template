name: Codex window primer

on:
  schedule:
    # codex-window-primer: cron-managed
    - cron: "0 0 1 1 *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-window-primer
  cancel-in-progress: false

env:
  CODEX_MODEL: gpt-5.6-luna
  CODEX_IMAGE: ghcr.io/icoretech/codex-docker:0.150.1@sha256:cff8e01c6da50536300a842686ac182ebde13ea51f6c6e0bbedfdfd052c81986
  PLAN_FILE: schedule.json

jobs:
  prime:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Decide whether this run is due
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import date, datetime, timedelta
          from zoneinfo import ZoneInfo

          with open(os.environ["PLAN_FILE"], "r", encoding="utf-8") as handle:
              plan = json.load(handle)

          if not plan.get("enabled", False):
              print("Plan is disabled; scheduled run skipped.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("should_run=false\n")
              raise SystemExit(0)

          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              print("Manual run requested; bypassing only the calendar gate.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("should_run=true\n")
              raise SystemExit(0)

          timezone = ZoneInfo(plan["timezone"])
          now = datetime.now(timezone)
          work_start = datetime.fromisoformat(plan["work_start_local"]).astimezone(timezone)
          window_duration = timedelta(minutes=int(plan.get("window_duration_minutes", 300)))
          reset_after_start = timedelta(minutes=int(plan.get("reset_after_start_minutes", 90)))
          if window_duration <= timedelta(0) or reset_after_start < timedelta(0) or reset_after_start >= window_duration:
              raise SystemExit("Invalid window/reset timing configuration")
          primer = work_start - (window_duration - reset_after_start)
          mode = plan["mode"]
          tolerance_before = timedelta(minutes=10)
          tolerance_after = timedelta(hours=2)
          due = False

          active_from = date.fromisoformat(plan["active_from_local"])
          active_until_value = plan.get("active_until_local")
          active_until = date.fromisoformat(active_until_value) if active_until_value else None
          skipped_dates = {date.fromisoformat(value) for value in plan.get("skip_dates_local", [])}

          if mode == "once":
              due = (
                  primer - tolerance_before <= now <= primer + tolerance_after
                  and work_start.date() not in skipped_dates
              )
          elif mode in {"daily", "weekly"}:
              target_time = work_start.timetz().replace(tzinfo=None)
              for day_delta in range(-2, 3):
                  candidate_work_date = now.date() + timedelta(days=day_delta)
                  if mode == "weekly" and candidate_work_date.weekday() != work_start.weekday():
                      continue
                  if candidate_work_date < active_from or (active_until and candidate_work_date > active_until):
                      continue
                  if candidate_work_date in skipped_dates:
                      continue
                  candidate_work_start = datetime.combine(candidate_work_date, target_time, tzinfo=timezone)
                  candidate_primer = candidate_work_start - (window_duration - reset_after_start)
                  if candidate_primer - tolerance_before <= now <= candidate_primer + tolerance_after:
                      due = True
                      primer = candidate_primer
                      break
          else:
              raise SystemExit(f"Unsupported schedule mode: {mode}")

          print(f"Configured timezone: {plan['timezone']}; current local time: {now.isoformat()}")
          print(f"Computed prime time: {primer.isoformat()}; mode: {mode}; due: {str(due).lower()}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_run={str(due).lower()}\n")
          PY

      - name: Install age
        if: steps.gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age

      - name: Prime Codex and persist refreshed credential bundle
        if: steps.gate.outputs.should_run == 'true'
        env:
          AGE_PRIVATE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077

          if [[ -z "${AGE_PRIVATE_KEY:-}" ]]; then
            echo "::error::The AGE_PRIVATE_KEY repository secret is not configured."
            exit 1
          fi
          if [[ ! -s auth.json.enc ]]; then
            echo "::error::auth.json.enc is missing or empty. Complete the local bootstrap first."
            exit 1
          fi

          key_file="$RUNNER_TEMP/age-key.txt"
          codex_home="$RUNNER_TEMP/codex-home"
          codex_output="$RUNNER_TEMP/codex-output.txt"
          codex_error="$RUNNER_TEMP/codex-error.txt"
          cleanup() {
            rm -f "$key_file" "$codex_output" "$codex_error"
            rm -rf "$codex_home"
          }
          trap cleanup EXIT

          mkdir -p "$codex_home"
          chmod 700 "$codex_home"
          printf '%s\n' "$AGE_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"

          cat > "$codex_home/config.toml" <<'EOF'
          cli_auth_credentials_store = "file"
          model_reasoning_effort = "low"
          EOF

          age --decrypt \
            --identity "$key_file" \
            --output "$codex_home/auth.json" \
            auth.json.enc
          chmod 600 "$codex_home/auth.json"
          before_sha="$(sha256sum "$codex_home/auth.json" | cut -d' ' -f1)"

          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env CODEX_HOME=/home/codex/.codex \
            --env HOME=/tmp \
            --volume "$codex_home:/home/codex/.codex" \
            --workdir /tmp \
            "$CODEX_IMAGE" \
            exec \
            --model "$CODEX_MODEL" \
            --config model_reasoning_effort=low \
            --sandbox read-only \
            --skip-git-repo-check \
            --ephemeral \
            "Reply with exactly: OK" \
            >"$codex_output" 2>"$codex_error"
          codex_status="$?"
          set -e

          if [[ "$codex_status" -ne 0 ]]; then
            echo "::error::Codex invocation failed; response and diagnostic output were suppressed."
            exit "$codex_status"
          fi

          if [[ ! -s "$codex_home/auth.json" ]]; then
            echo "::error::Codex credential file was not preserved; response output was suppressed."
            exit 1
          fi

          after_sha="$(sha256sum "$codex_home/auth.json" | cut -d' ' -f1)"
          if [[ "$before_sha" != "$after_sha" ]]; then
            recipient="$(age-keygen -y < "$key_file")"
            age --encrypt \
              --recipient "$recipient" \
              --output "$RUNNER_TEMP/auth.json.enc" \
              "$codex_home/auth.json"
            test -s "$RUNNER_TEMP/auth.json.enc"
            mv "$RUNNER_TEMP/auth.json.enc" auth.json.enc

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add auth.json.enc
            git commit -m "chore: refresh encrypted Codex auth bundle"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Codex invocation succeeded; refreshed credentials were saved as ciphertext."
          else
            echo "Codex invocation succeeded; encrypted credential bundle was unchanged."
          fi

          echo "Prime completed with the pinned Codex container, model ${CODEX_MODEL}, and low reasoning; response output was suppressed."
